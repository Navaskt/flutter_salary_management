name: flutter_salary_management
description: A comprehensive Flutter salary management application with modern UI for tracking and managing salaries.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  fl_chart: ^0.66.0
  pdf: ^3.10.7
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  intl: ^0.18.1
  sqflite: ^2.3.2
  google_fonts: ^6.1.0
  flutter_slidable: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
